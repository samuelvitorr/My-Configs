##### =========================
##### Prefix (Ctrl+s)
##### =========================
set -g prefix C-s
unbind C-b
unbind r
bind r source-file ~/.tmux.conf \; display-message "🌀 Configuração do TMUX recarregada..."

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

##### =========================
##### FZF (JANELAS)
##### =========================
bind C-l run-shell "tmux list-window -a -F '#S:#I #W' \
  | fzf --tmux center --prompt=' Janelas: ' \
  | awk '{print \$1}' \
  | xargs -r tmux switch-client -t"

##### =========================
##### SESH (CORRIGIDO)
##### =========================
bind-key K display-popup -E -w 90% -h 80% "sh -c '
sesh connect \"\$( \
  sesh list --icons | fzf \
    --no-sort --ansi \
    --border-label \" sesh \" \
    --prompt \"⚡  \" \
    --header \"🔑 ^a all | ^t tmux | ^x zoxide | ^d kill | ^f find\" \
    --bind \"tab:down,btab:up\" \
    --bind \"ctrl-a:reload(sesh list --icons)\" \
    --bind \"ctrl-t:reload(sesh list -t --icons)\" \
    --bind \"ctrl-x:reload(sesh list -z --icons)\" \
    --bind \"ctrl-f:reload(fd -H -d 2 -t d -E .Trash . ~)\" \
    --bind \"ctrl-d:execute(tmux kill-session -t {2..})+reload(sesh list --icons)\" \
    --preview \"sesh preview {}\" \
    --preview-window \"right:45%\" \
)\"'"

##### =========================
##### Popups (prefix + Ctrl + tecla)
##### =========================

bind-key C-n display-popup -E -w 60% -h 60% "nvim /tmp/scratch.md"
bind-key C-p display-popup -E -w 60% -h 60% "python"
bind-key C-h display-popup -E -w 80% -h 80% "htop"
bind-key C-t display-popup -E -w 80% -h 80% ""
bind-key C-x display-popup -w 80% -h 80% "just run"

# 🔥 Sessionizer (CORRIGIDO)
bind-key f display-popup -E -w 90% -h 85% "/bin/bash ~/.config/tmux/scripts/tmux-sessionizer.sh"

##### =========================
##### Popup flutuante persistente (Toggle)
##### =========================
bind-key -r C-w run-shell "${HOME}/dotfiles/tmux/scripts/popup.sh float_popup term ${HOME}"

##### =========================
##### Nova sessão
##### =========================
bind n command-prompt "new-session -s '%%'"

# Melhorados
bind C-y display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "yazi"
#bind C-t display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "zsh"
bind C-g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"

##### =========================
##### Menu Config
##### =========================
bind d display-menu -T "#[align=centre]Config" -x C -y C \
    ".fish" z  "run-shell 'tmux display-popup -E -w 85% -h 85% nvim ~/.config/fish/config.fish'" \
    ".tmux.conf" t  "run-shell 'tmux display-popup -E -w 85% -h 85% nvim ~/.tmux.conf'" \
    ".nvim" v  "run-shell 'tmux display-popup -E -w 95% -h 95% -d ~/.config/nvim nvim'" \
    "quit" q "detach-client"

##### =========================
##### Terminal & Cores
##### =========================
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-ghostty:Tc"
set -as terminal-overrides ",xterm-256color:RGB,*256col*:RGB"
set -as terminal-features ',xterm-kitty:allow-passthrough'
set -g allow-passthrough on

##### =========================
##### Histórico & Atividade
##### =========================
set -g history-limit 30000
setw -g monitor-activity off
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off

##### =========================
##### Índice base das janelas/panes
##### =========================
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

##### =========================
##### Títulos das janelas
##### =========================
set -g set-titles on
set -g set-titles-string '#{?client_prefix,🅿️,} #S | #I:#W | #T'

##### =========================
##### Modo de cópia (VI) + Clipboard (FIX MOUSE)
##### =========================
setw -g mode-keys vi

# 🔥 seleção automática com mouse (igual versão antiga)
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# teclado continua funcionando
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"

##### =========================
##### Mouse & Navegação
##### =========================
set -g mouse on
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

##### =========================
##### Plugins (TPM)
##### =========================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'omerxx/tmux-sessionx'

##### =========================
##### Tema: Catppuccin Mocha (Bubble)
##### =========================
set -g @catppuccin_bg "#1e1e2e"
set -g @catppuccin_fg "#cdd6f4"
set -g @catppuccin_red "#f38ba8"
set -g @catppuccin_green "#a6e3a1"
set -g @catppuccin_yellow "#f9e2af"
set -g @catppuccin_blue "#89b4fa"
set -g @catppuccin_mauve "#cba6f7"
set -g @catppuccin_peach "#fab387"
set -g @catppuccin_overlay0 "#6c7086"

set -g @bubble_sep_left ""
set -g @bubble_sep_right ""

##### =========================
##### Status Bar
##### =========================
set -g status on
set -g status-interval 5
set -g status-justify centre
set -g status-position bottom
set -g status-left-length 60
set -g status-right-length 150
set -g status-style "bg=#{@catppuccin_bg},fg=#{@catppuccin_fg}"

set -g window-status-separator ""

set -g status-left "#[fg=#{@catppuccin_blue},bg=#{@catppuccin_bg}]#{@bubble_sep_left}#[fg=#{@catppuccin_bg},bg=#{@catppuccin_blue},bold] #S #[fg=#{@catppuccin_blue},bg=#{@catppuccin_bg}]#{@bubble_sep_right}"

setw -g window-status-format "#[fg=#{@catppuccin_overlay0},bg=#{@catppuccin_bg}]#{@bubble_sep_left}#[fg=#{@catppuccin_bg},bg=#{@catppuccin_overlay0}] #I:#W #[fg=#{@catppuccin_overlay0},bg=#{@catppuccin_bg}]#{@bubble_sep_right}  "

setw -g window-status-current-format "#[fg=#{@catppuccin_mauve},bg=#{@catppuccin_bg}]#{@bubble_sep_left}#[fg=#{@catppuccin_bg},bg=#{@catppuccin_mauve},bold] #I:#W #[fg=#{@catppuccin_mauve},bg=#{@catppuccin_bg}]#{@bubble_sep_right}  "

set -g status-right "\
#[fg=#{@catppuccin_green},bg=#{@catppuccin_bg}]#{@bubble_sep_left}\
#[fg=#{@catppuccin_bg},bg=#{@catppuccin_green}] #(~/.tmux/plugins/tmux-battery/scripts/battery_icon.sh) #(~/.tmux/plugins/tmux-battery/scripts/battery_percentage.sh) \
#[fg=#{@catppuccin_green},bg=#{@catppuccin_bg}]#{@bubble_sep_right} \
#[fg=#{@catppuccin_blue},bg=#{@catppuccin_bg}]#{@bubble_sep_left}\
#[fg=#{@catppuccin_bg},bg=#{@catppuccin_blue}] #(~/.config/tmux/scripts/network.sh) \
#[fg=#{@catppuccin_blue},bg=#{@catppuccin_bg}]#{@bubble_sep_right}"

##### =========================
##### Pane Borders
##### =========================
set -g pane-border-style "fg=#{@catppuccin_overlay0}"
set -g pane-active-border-style "fg=#{@catppuccin_blue}"

##### =========================
##### Messages
##### =========================
set -g message-style "bg=#{@catppuccin_bg},fg=#{@catppuccin_fg}"
set -g message-command-style "bg=#{@catppuccin_bg},fg=#{@catppuccin_fg}"

##### =========================
##### Continuum & Resurrect
##### =========================
set -g @continuum-restore on
set -g @continuum-save-interval 10
set -g @resurrect-dir ~/.tmux/resurrect

##### =========================
##### TPM (SEMPRE ÚLTIMO)
##### =========================
run '~/.tmux/plugins/tpm/tpm'
